<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="NovaUI.WinForms banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10141C"/>
      <stop offset="100%" stop-color="#1B2432"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F6BFF"/>
      <stop offset="100%" stop-color="#8598FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>

  <!-- glow dots -->
  <circle cx="1050" cy="70" r="90" fill="#4F6BFF" opacity="0.14"/>
  <circle cx="1130" cy="200" r="60" fill="#3DD68C" opacity="0.12"/>
  <circle cx="980" cy="230" r="40" fill="#8598FF" opacity="0.10"/>

  <!-- brand mark: rounded square with N -->
  <rect x="72" y="86" width="108" height="108" rx="24" fill="url(#accent)"/>
  <text x="126" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" fill="#FFFFFF" text-anchor="middle">N</text>

  <!-- title + tagline -->
  <text x="216" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" fill="#E8EBF2">NovaUI.WinForms</text>
  <text x="218" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#8A93A6">Custom-drawn WinForms controls &#183; dark &amp; light themes &#183; HTML viewer with parameter injection</text>

  <!-- control chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#E8EBF2">
    <rect x="218"  y="206" width="96" height="30" rx="15" fill="#171C26" stroke="#262D3B"/>
    <text x="266"  y="226" text-anchor="middle">Button</text>
    <rect x="324"  y="206" width="92" height="30" rx="15" fill="#171C26" stroke="#262D3B"/>
    <text x="370"  y="226" text-anchor="middle">Panel</text>
    <rect x="426"  y="206" width="110" height="30" rx="15" fill="#171C26" stroke="#262D3B"/>
    <text x="481"  y="226" text-anchor="middle">TextBox</text>
    <rect x="546"  y="206" width="96" height="30" rx="15" fill="#171C26" stroke="#262D3B"/>
    <text x="594"  y="226" text-anchor="middle">Label</text>
    <rect x="652"  y="206" width="122" height="30" rx="15" fill="#171C26" stroke="#262D3B"/>
    <text x="713"  y="226" text-anchor="middle">ComboBox</text>
    <rect x="784"  y="206" width="130" height="30" rx="15" fill="#171C26" stroke="#262D3B"/>
    <text x="849"  y="226" text-anchor="middle">ProgressBar</text>
    <rect x="924"  y="206" width="132" height="30" rx="15" fill="#171C26" stroke="#262D3B"/>
    <text x="990"  y="226" text-anchor="middle">HtmlViewer</text>
  </g>
</svg>
